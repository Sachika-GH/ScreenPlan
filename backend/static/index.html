<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ScreenPlan — Cross-device Screen Time &amp; AI Planner</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">

<!-- ═══ Login Page ═══ -->
<div id="login-page" class="page active">
  <div class="login-box">
    <div class="brand-mark"><span>S</span></div>
    <h1>ScreenPlan</h1>
    <p class="subtitle">跨设备屏幕时间 &middot; AI 日程规划</p>
    <div id="login-tabs">
      <button class="tab active" data-tab="login-form">登录</button>
      <button class="tab" data-tab="register-form">注册</button>
    </div>
    <form id="login-form" class="auth-form active">
      <div class="field-group">
        <label>邮箱地址</label>
        <input type="email" id="login-email" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="field-group">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">登 录</button>
      <p id="login-error" class="error"></p>
    </form>
    <form id="register-form" class="auth-form">
      <div class="field-group">
        <label>家庭名称</label>
        <input type="text" id="reg-family" placeholder="例如：我的家庭" required>
      </div>
      <div class="field-group">
        <label>显示名称</label>
        <input type="text" id="reg-display" placeholder="你的名字" required>
      </div>
      <div class="field-group">
        <label>邮箱地址</label>
        <input type="email" id="reg-email" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="field-group">
        <label>密码（6位以上）</label>
        <input type="password" id="reg-password" placeholder="至少6位" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary">注 册</button>
      <p id="reg-error" class="error"></p>
    </form>
  </div>
</div>

<!-- ═══ Main Page ═══ -->
<div id="main-page" class="page">

  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="brand"><div class="brand-symbol">S</div>ScreenPlan</div>
    <div class="user-info">
      <span id="user-name"></span>
      <span id="user-email" class="muted"></span>
    </div>
    <div class="nav-links">
      <a href="#dashboard" class="nav-link active" data-page="dashboard">
        <span class="nav-icon">&#9673;</span> 仪表盘
      </a>
      <a href="#timeline" class="nav-link" data-page="timeline">
        <span class="nav-icon">&#9716;</span> 时间线
      </a>
      <a href="#devices" class="nav-link" data-page="devices">
        <span class="nav-icon">&#9776;</span> 设备管理
      </a>
      <a href="#schedule" class="nav-link" data-page="schedule">
        <span class="nav-icon">&#9779;</span> 日程建议
      </a>
      <a href="#friends" class="nav-link" data-page="friends">
        <span class="nav-icon">&#9787;</span> 好友
      </a>
    </div>
    <div class="sidebar-footer">
      <button id="logout-btn">退出登录</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main>

    <!-- Dashboard -->
    <section id="page-dashboard" class="content active">
      <h2>今日概览</h2>
      <div id="dashboard-summary" class="summary-cards"></div>
      <div id="dashboard-devices" class="device-cards"></div>
    </section>

    <!-- Timeline -->
    <section id="page-timeline" class="content">
      <h2>设备时间线</h2>
      <div class="timeline-header">
        <div class="date-picker">
          <button class="nav-day" id="date-prev" title="前一天">&lsaquo;</button>
          <input type="date" id="timeline-date">
          <button class="nav-day" id="date-next" title="后一天">&rsaquo;</button>
        </div>
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoom-out" title="缩小">&minus;</button>
          <span class="zoom-level" id="zoom-label">24h</span>
          <button class="zoom-btn" id="zoom-in" title="放大">+</button>
          <button class="zoom-btn now-btn" id="zoom-now" title="跳转到当前时间" style="display:none">&#9673; 现在</button>
        </div>
        <button id="timeline-refresh">刷新</button>
      </div>
      <div id="timeline-summary" class="timeline-summary"></div>
      <div id="timeline-chart-wrap"></div>
      <div class="legend" id="timeline-legend" style="display:none">
        <div class="legend-item"><span class="dot learning"></span> 学习</div>
        <div class="legend-item"><span class="dot entertainment"></span> 娱乐</div>
        <div class="legend-item"><span class="dot other"></span> 其他</div>
      </div>
    </section>

    <!-- Devices -->
    <section id="page-devices" class="content">
      <h2>设备管理</h2>
      <div class="device-register-form">
        <input type="text" id="new-device-name" placeholder="设备名称" maxlength="64">
        <select id="new-device-platform">
          <option value="windows">Windows</option>
          <option value="macos">macOS</option>
          <option value="ios">iOS</option>
          <option value="android">Android</option>
          <option value="linux">Linux</option>
        </select>
        <button id="register-device-btn">注册设备</button>
      </div>
      <div id="device-list"></div>
    </section>

    <!-- Schedule -->
    <section id="page-schedule" class="content">
      <h2>AI 日程建议</h2>
      <div class="schedule-actions">
        <button id="generate-schedule-btn">生成今日计划</button>
        <button id="view-friend-schedule-btn" style="display:none">查看好友计划</button>
      </div>
      <div id="schedule-content" class="markdown-body"></div>
    </section>

    <!-- Friends -->
    <section id="page-friends" class="content">
      <h2>好友</h2>
      <div class="friend-actions">
        <input type="email" id="friend-email" placeholder="输入好友邮箱地址">
        <button id="send-friend-request">添加好友</button>
      </div>
      <h3>收到的请求</h3>
      <div id="received-requests"></div>
      <h3>已发送的请求</h3>
      <div id="sent-requests"></div>
      <h3>好友列表</h3>
      <div id="friends-list"></div>
    </section>

  </main>
</div>

</div>

<!-- Tooltip -->
<div id="timeline-tooltip" class="timeline-tooltip"></div>

<script src="/static/app.js"></script>
</body>
</html>

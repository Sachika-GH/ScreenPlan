# Example nginx reverse proxy configuration for ScreenPlan backend.
# Place at: /etc/nginx/sites-available/screenplan
# Enable:    ln -s /etc/nginx/sites-available/screenplan /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name screenplan.yourdomain.com;

    # Uncomment for HTTPS (after certbot):
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/screenplan.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/screenplan.yourdomain.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
